<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>Main</title>
	<head>
	<body>
		<h1>Vnos ITM</h1>
		{% if podatki['uspeh'] %}
			<i><b>Uspešno</b> sem se povezal na database.</i>
		{% else %}
			<i><b>Neuspešno</b> sem se povezal na database.</i>
		{% endif %}
		
		<form action="/" method = "POST">
			<label for="fname">Višina (cm)</label><br>
			<input type="text" id="fname" name="visina" value="{{podatki['visina']}}"><br>
			<label for="lname">Teža (kg)</label><br>
			<input type="text" id="lname" name="teza" value="{{podatki['teza']}}"><br><br>
			<input type="submit" value="Submit">
		</form> 
		{% if podatki['itm'] %}
		<i>Vaš itm je {{podatki['itm']}}</i>
		{% endif %}
		
		<br><a href="/dnevnik">Dnevnik</a>
	</body>
</html>
