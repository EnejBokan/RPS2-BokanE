<!DOCTYPE html>
	<html>
		<head>
			<title>My first flask project!</title>
			<link href="{{url_for('static', filename='style.css')}}" rel="stylesheet">
		</head>
		<body>

		<h1>Dnevnik dogodkov</h1>
		<table border ="1">
			<tr>
				<th>ID</th>
					<th>Datum in čas</th>
					<th>Višina</th>
					<th>Teža</th>
					<th>ITM</th>
					<th>Akcija</th>
				</tr>
				{% for obj in podatki['seznam'] %}
				<tr>
					<td>{{obj.ID}}</td>
					<td>{{obj.datumCas}}</td>
					<td>{{obj.visina}}</td>
					<td>{{obj.teza}}</td>
					<td>{{obj.itm}}</td>
					<td><a href = "/izbrisi/{{obj.ID}}">Izbrisi</a>|<a href = "/arhiviraj/{{obj.ID}}">Arhiviraj</a></td>
				</tr>
				{% endfor %}
			</table>
			
			
<br><a href="/">Kalkulator</a>




		</body>
	</html>
